<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Configuración</title>
    <style>
        body {
            margin: 0;
            padding: 24px;
            background: linear-gradient(135deg, #11131a, #1a1e2a);
            color: #f2f5ff;
            font-family: 'Segoe UI', sans-serif;
            box-sizing: border-box;
        }
        .card {
            max-width: 820px;
            margin: 0 auto;
            background: rgba(20, 23, 32, 0.95);
            border: 1px solid #2b3142;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.35);
        }
        h1 { margin-top: 0; font-size: 24px; color: #00f2fe; }
        p { color: #b3bed3; line-height: 1.5; }
        .field { margin-top: 16px; }
        label { display: block; margin-bottom: 8px; font-weight: 700; color: #ffd700; }
        input[type="text"] {
            width: 100%;
            padding: 12px 14px;
            border-radius: 10px;
            border: 1px solid #49536d;
            background: #0f1219;
            color: #fff;
            box-sizing: border-box;
            font-size: 14px;
        }
        .actions { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
        button {
            border: none;
            border-radius: 10px;
            padding: 12px 16px;
            cursor: pointer;
            font-weight: 700;
            color: white;
        }
        .btn-primary { background: linear-gradient(90deg, #00f2fe, #00c4ff); color: #071019; }
        .btn-secondary { background: #374151; }
        .hint { margin-top: 14px; font-size: 13px; color: #7dd3fc; }
        .status { margin-top: 16px; padding: 12px 14px; border-radius: 10px; background: #111827; border: 1px solid #2d3748; color: #e5e7eb; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Configuración de almacenamiento</h1>
        <p>Selecciona la carpeta donde se guardarán los datos de la app. Por defecto se usará la carpeta <strong>GatiApp</strong> dentro de tu usuario.</p>

        <div class="field">
            <label for="ruta-datos">Carpeta de datos</label>
            <input id="ruta-datos" type="text" placeholder="/home/tu-usuario/GatiApp">
        </div>

        <div class="actions">
            <button class="btn-primary" onclick="guardarRuta()">Guardar carpeta</button>
            <button class="btn-secondary" onclick="resetearRuta()">Restaurar por defecto</button>
        </div>

        <div class="hint">La app creará la carpeta automáticamente si no existe.</div>
        <div class="status" id="estado-ruta">Esperando selección...</div>
    </div>

    <script src="http://localhost:23847/socket.io/socket.io.js"></script>
    <script>
        const baseUrl = 'ws://localhost:23847/';
const socket = io(baseUrl);
        const inputRuta = document.getElementById('ruta-datos');
        const estadoRuta = document.getElementById('estado-ruta');

        socket.on('config_actual', (config) => {
            const ruta = config && config.storagePath ? config.storagePath : '';
            inputRuta.value = ruta || '';
            estadoRuta.textContent = ruta ? `Ruta actual: ${ruta}` : 'Ruta actual: carpeta por defecto';
        });

        function guardarRuta() {
            const ruta = inputRuta.value.trim();
            socket.emit('guardar_ruta_datos', ruta);
            estadoRuta.textContent = 'Guardando carpeta...';
        }

        function resetearRuta() {
            inputRuta.value = '';
            socket.emit('guardar_ruta_datos', '');
            estadoRuta.textContent = 'Restaurando carpeta por defecto...';
        }

        socket.on('ruta_datos_actualizada', (data) => {
            if (data && data.storagePath) {
                estadoRuta.textContent = `Ruta actual: ${data.storagePath}`;
            } else {
                estadoRuta.textContent = 'Ruta actual: carpeta por defecto';
            }
        });
    </script>
</body>
</html>
