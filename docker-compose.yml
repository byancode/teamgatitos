services:
  teamgatitos:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - ./src/:/app/
      - ./dist/:/app/81dcb9af-f6f5-5ecb-bac7-ad5caf4fdc06/
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - 'traefik.http.routers.teamgatitos-web.rule=Host(`teamgatitos.byancode.com`)'
      - traefik.http.routers.teamgatitos-web.entrypoints=web
      - traefik.http.routers.teamgatitos-web.middlewares=redirect-to-https
      - traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https
      - 'traefik.http.routers.teamgatitos-websecure.rule=Host(`teamgatitos.byancode.com`)'
      - traefik.http.routers.teamgatitos-websecure.entrypoints=websecure
      - traefik.http.routers.teamgatitos-websecure.tls=true
      - traefik.http.routers.teamgatitos-websecure.service=teamgatitos
      - traefik.http.services.teamgatitos.loadbalancer.server.port=8080
    command: ["python3", "-m", "http.server", "8080", "--bind", "0.0.0.0"]
networks:
  proxy:
    external: true
